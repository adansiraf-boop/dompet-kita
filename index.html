<!DOCTYPE html>
<html lang="id"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f8fc">
<title>PetaDana</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=7">
</head><body>
<div id="login" class="login hide"><div class="pane">
<h2>PetaDana</h2><small>Masukkan PIN rahasia keluarga. Gunakan PIN yang sama di HP istri/suami.</small>
<label>Nama kamu</label><input id="nm" placeholder="mis. Budi" autocomplete="off">
<label>PIN</label><input id="pin" type="password" autocomplete="off">
<button class="btn" data-a="login">Masuk</button></div></div>
<header class="top"><h1 id="title">Beranda</h1><div class="hr"><div id="sync" class="sync"></div><button id="eye" class="eye" data-a="eye" aria-label="Tampilkan atau sembunyikan nominal"></button></div></header>
<main id="app"></main>
<nav class="nav">
<button data-a="tab" data-v="home"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>Beranda</button>
<button data-a="tab" data-v="hist"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Riwayat</button>
<button class="fab" data-a="fab" aria-label="Tambah transaksi"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></button>
<button data-a="tab" data-v="stat"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V10M12 20V4M19 20v-6"/></svg>Statistik</button>
<button data-a="tab" data-v="acc"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h13v4M3 7v11a2 2 0 0 0 2 2h15V9H5a2 2 0 0 1-2-2zM16 14h.01"/></svg>Rekening</button>
</nav>
<div id="sheet" class="sheet"></div>
<div id="ov" class="sheet"></div>
<div id="toast"></div>
<script src="app.js?v=7"></script>
</body></html>
